# Every action in .github/workflows is pinned to a full commit SHA, so a moved
# tag can never run new code with this repo's write token. Dependabot keeps the
# pins current by proposing bumps, which update the SHA and its version comment
# together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
