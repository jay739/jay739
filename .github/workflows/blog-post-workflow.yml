name: Latest blog posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull latest posts from jay739.dev/rss.xml
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://jay739.dev/rss.xml"
          max_post_count: 5
          template: "<br>&bull; <a href=\"$url\">$title</a> <sub><i>$date</i></sub>"
          date_format: "mmm dd, yyyy"
          comment_tag_name: "BLOG-POST-LIST"
          commit_message: "chore: refresh latest blog posts"
