<svg width="600" height="236" viewBox="0 0 600 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The stick family from my wall display, Dad, the kid and Mom, drawn from the display's own figure rig. The kid waves and everyone blinks.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #b45309; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .body { fill: #334155; font-size: 12.5px; }
    .small { fill: #475569; font-size: 10.5px; }
    .fig * { transform-box: view-box; }
    .sm-arm-l { transform-origin: 75px 93px; transform: rotate(45deg); }
    .sm-arm-r { transform-origin: 85px 93px; transform: rotate(-45deg); }
    .sm-fore-l { transform-origin: 75px 111px; }
    .sm-fore-r { transform-origin: 85px 111px; }
    .sm-leg-l { transform-origin: 80px 124px; transform: rotate(23deg); }
    .sm-leg-r { transform-origin: 80px 124px; transform: rotate(-23deg); }
    .sm-shin-l { transform-origin: 80px 150px; transform: rotate(-23deg); }
    .sm-shin-r { transform-origin: 80px 150px; transform: rotate(23deg); }
    .sm-head { transform-origin: 80px 82px; }
    .sm-eyes { transform-origin: 80px 50px; animation: blink 11s infinite; }
    .mom .sm-eyes { animation-delay: -3.7s; }
    .kid .sm-eyes { animation-delay: -7.1s; }
    /* The kiosk's wave (stickman.css sm-wave), then a pause before the next one. */
    .kid .sm-arm-r { animation: wave-arm 7s ease-in-out infinite; }
    .kid .sm-fore-r { animation: wave-fore 7s ease-in-out infinite; }
    /* The parents' eyes follow the kid in the kiosk; here their heads lean his way. */
    .dad .sm-head { animation: lean-dad 9s ease-in-out infinite; }
    .mom .sm-head { animation: lean-mom 9s ease-in-out infinite; animation-delay: -4s; }
    @keyframes blink {
      0%, 29%, 33%, 68%, 72%, 100% { transform: scaleY(1); }
      30.5%, 69.5% { transform: scaleY(0.1); }
    }
    @keyframes wave-arm {
      0%, 40%, 100% { transform: rotate(-45deg); }
      7%, 33% { transform: rotate(-125deg); }
    }
    @keyframes wave-fore {
      0%, 7%, 40%, 100% { transform: rotate(0deg); }
      12% { transform: rotate(-12deg); }
      18% { transform: rotate(14deg); }
      24% { transform: rotate(-12deg); }
      30% { transform: rotate(14deg); }
      34% { transform: rotate(2deg); }
    }
    @keyframes lean-dad { 0%, 100% { transform: rotate(0deg); } 45%, 60% { transform: rotate(-8deg); } }
    @keyframes lean-mom { 0%, 100% { transform: rotate(0deg); } 45%, 60% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="599" height="235" rx="10" fill="#ffffff" stroke="#e2e8f0" />
  <text x="30" y="42" class="title">THE FAMILY ON MY WALL</text>
  <text x="30" y="72" class="body">Stick figures that live on my wall</text>
  <text x="30" y="90" class="body">display at night. Local LLMs give</text>
  <text x="30" y="108" class="body">them a mind: memories, beliefs,</text>
  <text x="30" y="126" class="body">and moves they invent themselves.</text>
  <text x="30" y="216" class="small">Drawn from the display's own figure rig</text>
  <line x1="246" y1="216" x2="574" y2="216" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <svg class="fig dad" x="227.8" y="37.6" width="184.5" height="178" viewBox="-34 -44 228 220" overflow="visible" color="#1e293b"><g class="sm-body" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><line x1="80" y1="82" x2="80" y2="124" stroke-width="7"/><line x1="75" y1="93" x2="85" y2="93" stroke-width="6"/><g class="sm-leg-l"><line x1="80" y1="124" x2="80" y2="150"/><g class="sm-shin-l"><line x1="80" y1="150" x2="80" y2="174"/><line x1="80" y1="174" x2="67" y2="174"/></g></g><g class="sm-leg-r"><line x1="80" y1="124" x2="80" y2="150"/><g class="sm-shin-r"><line x1="80" y1="150" x2="80" y2="174"/><line x1="80" y1="174" x2="93" y2="174"/></g></g><g class="sm-head"><circle cx="80" cy="52" r="28" fill="currentColor" stroke="none"/><g stroke="#f8fafc" stroke-width="3.2" stroke-linecap="round" fill="none"><path d="M64 37 Q70 31.5 76 34.5"/><path d="M96 37 Q90 31.5 84 34.5"/></g><g class="sm-eyes" fill="#f8fafc" stroke="none"><ellipse cx="70" cy="49" rx="5.2" ry="6.6"/><ellipse cx="90" cy="49" rx="5.2" ry="6.6"/></g><path d="M69 61 Q80 71 91 61" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/></g><g class="sm-arm-l"><line x1="75" y1="93" x2="75" y2="111"/><g class="sm-fore-l"><line x1="75" y1="111" x2="75" y2="128"/><circle cx="75" cy="128" r="4.2" fill="currentColor" stroke="none"/></g></g><g class="sm-arm-r"><line x1="85" y1="93" x2="85" y2="111"/><g class="sm-fore-r"><line x1="85" y1="111" x2="85" y2="128"/><circle cx="85" cy="128" r="4.2" fill="currentColor" stroke="none"/></g></g></g></svg>
  <svg class="fig kid" x="356.0" y="103.0" width="116.1" height="112" viewBox="-34 -44 228 220" overflow="visible" color="#1e293b"><g class="sm-body" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><line x1="80" y1="82" x2="80" y2="124" stroke-width="7"/><line x1="75" y1="93" x2="85" y2="93" stroke-width="6"/><g class="sm-leg-l"><line x1="80" y1="124" x2="80" y2="150"/><g class="sm-shin-l"><line x1="80" y1="150" x2="80" y2="174"/><line x1="80" y1="174" x2="67" y2="174"/></g></g><g class="sm-leg-r"><line x1="80" y1="124" x2="80" y2="150"/><g class="sm-shin-r"><line x1="80" y1="150" x2="80" y2="174"/><line x1="80" y1="174" x2="93" y2="174"/></g></g><g class="sm-head"><circle cx="80" cy="52" r="28" fill="currentColor" stroke="none"/><g stroke="#f8fafc" stroke-width="3.2" stroke-linecap="round" fill="none"><path d="M64 37 Q70 31.5 76 34.5"/><path d="M96 37 Q90 31.5 84 34.5"/></g><g class="sm-eyes" fill="#f8fafc" stroke="none"><ellipse cx="70" cy="49" rx="5.2" ry="6.6"/><ellipse cx="90" cy="49" rx="5.2" ry="6.6"/></g><path d="M69 61 Q80 71 91 61" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/></g><g class="sm-arm-l"><line x1="75" y1="93" x2="75" y2="111"/><g class="sm-fore-l"><line x1="75" y1="111" x2="75" y2="128"/><circle cx="75" cy="128" r="4.2" fill="currentColor" stroke="none"/></g></g><g class="sm-arm-r"><line x1="85" y1="93" x2="85" y2="111"/><g class="sm-fore-r"><line x1="85" y1="111" x2="85" y2="128"/><circle cx="85" cy="128" r="4.2" fill="currentColor" stroke="none"/></g></g></g></svg>
  <svg class="fig mom" x="417.9" y="45.5" width="176.2" height="170" viewBox="-34 -44 228 220" overflow="visible" color="#1e293b"><g class="sm-body" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><line x1="80" y1="82" x2="80" y2="124" stroke-width="7"/><line x1="75" y1="93" x2="85" y2="93" stroke-width="6"/><g class="sm-leg-l"><line x1="80" y1="124" x2="80" y2="150"/><g class="sm-shin-l"><line x1="80" y1="150" x2="80" y2="174"/><line x1="80" y1="174" x2="67" y2="174"/></g></g><g class="sm-leg-r"><line x1="80" y1="124" x2="80" y2="150"/><g class="sm-shin-r"><line x1="80" y1="150" x2="80" y2="174"/><line x1="80" y1="174" x2="93" y2="174"/></g></g><path d="M74 97 L86 97 L104 146 L56 146 Z" fill="#ffffff" stroke-width="5"/><g class="sm-head"><g fill="currentColor" stroke="currentColor" stroke-width="7"><circle cx="80" cy="19" r="11" stroke="none"/><path d="M55 40 Q46 66 54 88" fill="none"/><path d="M105 40 Q114 66 106 88" fill="none"/></g><circle cx="80" cy="52" r="28" fill="currentColor" stroke="none"/><g stroke="#f8fafc" stroke-width="3.2" stroke-linecap="round" fill="none"><path d="M64 37 Q70 31.5 76 34.5"/><path d="M96 37 Q90 31.5 84 34.5"/></g><g class="sm-eyes" fill="#f8fafc" stroke="none"><ellipse cx="70" cy="49" rx="5.2" ry="6.6"/><ellipse cx="90" cy="49" rx="5.2" ry="6.6"/></g><path d="M69 61 Q80 71 91 61" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/></g><g class="sm-arm-l"><line x1="75" y1="93" x2="75" y2="111"/><g class="sm-fore-l"><line x1="75" y1="111" x2="75" y2="128"/><circle cx="75" cy="128" r="4.2" fill="currentColor" stroke="none"/></g></g><g class="sm-arm-r"><line x1="85" y1="93" x2="85" y2="111"/><g class="sm-fore-r"><line x1="85" y1="111" x2="85" y2="128"/><circle cx="85" cy="128" r="4.2" fill="currentColor" stroke="none"/></g></g></g></svg>
</svg>
